<!DOCTYPE html>
<html lang="en" data-th="cream">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#fafafa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NoteDown</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--fg:#e5e7eb;--ac:#60a5fa;--tb-hov:rgba(255,255,255,.08);
  --gl-a:rgba(60,68,92,.42);--gl-b:rgba(18,20,32,.28);--gl-bd:rgba(255,255,255,.16);--gl-in:rgba(255,255,255,.16);--gl-pop:rgba(28,31,44,.93);--gl-sh:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;padding-top:env(safe-area-inset-top,0);background:#fff;border-bottom:1px solid #e5e7eb}
#top input{flex:1;min-width:40px;height:36px;border:0;background:transparent;font:700 16px system-ui,sans-serif;color:#111;outline:none}
#top button{flex:none;border:1px solid #d1d5db;background:#f3f4f6;color:#111;font:600 13px system-ui,sans-serif;height:36px;padding:0 11px;border-radius:999px;cursor:pointer}
#top button.pri{background:#2563eb;border-color:#2563eb;color:#fff}
#pbar{position:sticky;top:52px;z-index:49;display:none;align-items:center;gap:8px;padding:6px 12px;background:#f3f4f6;border-bottom:1px solid #e5e7eb}
#pbar select,#pbar button{height:32px;border:1px solid #d1d5db;background:#fff;color:#111;font:600 13px system-ui,sans-serif;border-radius:999px;padding:0 12px;cursor:pointer}
#note{position:relative;width:100%;margin:0}
#note.empty::after{content:'Paste or type your notes here…';position:absolute;top:16px;left:16px;color:#9aa0a8;pointer-events:none;font-size:17px}
#note .rendered.v2c{width:100%;min-height:calc(100vh - 52px);padding:16px 16px 140px!important;font-size:var(--rs,17px);line-height:var(--rl,1.5);overflow:visible!important;background:transparent!important;display:block}
.tbox.v2 .rendered.v2c a{pointer-events:auto}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:120;background:#111;color:#fff;font:600 13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;display:none;max-width:92vw}


/* v19 premium editor page */
body{-webkit-tap-highlight-color:transparent}
#top button{display:grid;place-items:center;border:0;font:700 13px system-ui,sans-serif;transition:transform .12s}
#note.empty::after{color:#b4b8cc}
#note .rendered.v2c{padding-bottom:160px!important}
/* v26 reading-size tuner */
#tune{position:fixed;z-index:200;right:10px;top:calc(62px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 20px));display:none;padding:14px 16px 12px;border-radius:18px;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(20,22,43,.2),0 0 0 1px rgba(20,22,43,.07);font-family:system-ui,-apple-system,sans-serif;color:#3b3f66}
#tune.on{display:block}
#tune .tr{margin-bottom:12px}#tune label{display:flex;justify-content:space-between;font:700 13px system-ui,sans-serif;margin-bottom:6px}#tune label b{color:#4f46e5;font-weight:800}
#tune input[type=range]{width:100%;height:28px;margin:0;accent-color:#4f46e5;touch-action:pan-y}
#tune .tf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:#7a7f98}
#tune .tf button{border:0;height:30px;padding:0 12px;border-radius:10px;background:#eef0ff;color:#4f46e5;font:700 12px system-ui,sans-serif;cursor:pointer}
body:has(#panel.on) #tune{display:none!important}

/* v29 images + animated widgets */
.tn-img{display:block;margin:10px 0;line-height:0;text-align:center;position:relative}
.tn-img .img-box{position:relative;display:block;margin:0 auto;max-width:100%}
.tn-img img{display:block;width:100%;height:auto;border-radius:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tn-img.miss img{min-height:64px;background:#f3f4f6;border:1px dashed #9ca3af;color:#6b7280;font:13px system-ui,sans-serif;line-height:64px}
.tn-img.ProseMirror-selectednode img{outline:3px solid #2563eb;outline-offset:2px}
.tn-img .img-ctl{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);gap:4px;padding:4px;border-radius:999px;background:rgba(17,17,17,.84);line-height:1;z-index:2;white-space:nowrap}
.tn-img.ProseMirror-selectednode .img-ctl{display:flex}
.img-ctl button{border:0;background:transparent;color:#fff;font:600 12px system-ui,sans-serif;min-width:34px;height:32px;padding:0 9px;border-radius:999px;cursor:pointer}
.img-ctl button.on{background:#2563eb}
.img-ctl button.del{color:#fca5a5}
.tn-wgt{display:block;margin:12px 0;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;line-height:normal}
.tn-wgt.ProseMirror-selectednode{outline:3px solid #2563eb;outline-offset:2px}
.tn-wgt .wgt-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;background:#f3f4f6;border-bottom:1px solid #e5e7eb;font:600 12px system-ui,sans-serif;color:#6b7280}
.tn-wgt .wgt-bar span{flex:1}
.wgt-bar button{border:1px solid #d1d5db;background:#fff;color:#111;font:600 12px system-ui,sans-serif;height:28px;padding:0 10px;border-radius:999px;cursor:pointer}
.tn-wgt iframe{display:block;width:100%;border:0;background:#fff}
.tn-wgt{position:relative;overflow:visible;box-sizing:border-box;max-width:100%;margin:12px auto}
.tn-wgt .wgt-bar{border-radius:11px 11px 0 0}
.tn-wgt iframe{border-radius:11px}
.tn-wgt .wgt-more{position:absolute;top:6px;right:6px;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:rgba(17,17,17,.55);color:#fff;z-index:5;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wgt-menu{display:none;position:absolute;right:6px;top:44px;z-index:6;min-width:150px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px}
.wgt-menu.on{display:block}
.wgt-menu button{display:block;width:100%;height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#111;font:600 14px system-ui,sans-serif;text-align:left;cursor:pointer}
.wgt-menu button.del{color:#b91c1c}
.tn-wgt .rz,.tn-img .img-rz{display:none;position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:nwse-resize;touch-action:none;z-index:4;transition:background .25s,transform .25s}
.tn-wgt .rz svg,.tn-img .img-rz svg{display:block;width:18px;height:18px;margin:4px}
.tn-wgt .rz.ok,.tn-img .img-rz.ok{background:#16a34a;transform:scale(1.18)}
.tn-wgt.rsz .rz,.tn-img.ProseMirror-selectednode .img-rz{display:block}
.tn-wgt.rsz,.tn-wgt.ProseMirror-selectednode{outline:0}

/* v28 landing: flat Android-dialer style list */
#panel{--sf:system-ui,-apple-system,"Roboto","Segoe UI",Arial,sans-serif;position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#fafafa;color:#171717;font-family:var(--sf);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
#panel.on{display:flex;animation:pIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#panel button{font-family:inherit;-webkit-tap-highlight-color:transparent;outline:0}
#pnav{flex:none;height:calc(76px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,calc(50% - 346px)) 0 max(20px,calc(50% - 340px));display:flex;align-items:center}
.hg{display:none;align-items:center;width:100%;gap:2px}
#panel:not(.sel):not(.srch) .h-main,#panel.sel .h-sel,#panel.srch:not(.sel) .h-srch{display:flex}
#plt,#pselt{flex:1;min-width:0;margin:0;font:400 34px/40px var(--sf);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pselt{font-size:26px}
.hg button{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:#171717;display:grid;place-items:center;cursor:pointer}
.hg button:active{background:rgba(0,0,0,.07)}
.hg button:disabled{opacity:.3;pointer-events:none}
#pq{flex:1;min-width:0;height:44px;margin-left:4px;padding:0 18px;border:0;border-radius:22px;outline:0;background:#efefef;color:#171717;font:400 17px/22px var(--sf);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
#pq::placeholder{color:#8c8c8c}
#pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pw{max-width:720px;margin:0 auto;padding:0 0 130px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 24px 12px 20px;cursor:pointer;transition:background .12s}
.row:active{background:#efefef}
.row:not(:last-child)::after{content:'';position:absolute;left:20px;right:0;bottom:0;height:1px;background:#e8e8e8}
.ck{display:none;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #b5b5b5;place-items:center;color:#fff}
.ck svg{display:none}
.row.on .ck{background:#171717;border-color:#171717}.row.on .ck svg{display:block}
#panel.sel .ck{display:grid}#panel.sel .go{display:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font:400 17px/22px var(--sf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt span{display:block;margin-top:5px;font:400 14px/18px var(--sf);color:#8c8c8c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row time{flex:none;font:400 14px/18px var(--sf);color:#8c8c8c}
.go{flex:none;width:36px;height:36px;border-radius:50%;background:#efefef;color:#222;display:grid;place-items:center}
.pe{padding:120px 20px;text-align:center;font:400 17px/22px var(--sf);color:#9a9a9a}
#pNew{position:absolute;left:max(20px,calc(50% - 340px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border:0;border-radius:20px;background:#fff;color:#444;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.14);cursor:pointer;transition:transform .12s}
#pNew:active{transform:scale(.94)}
#panel.sel #pNew,#panel.srch #pNew{display:none}
#pmenu{position:absolute;z-index:3;top:calc(60px + env(safe-area-inset-top,0px));right:max(14px,calc(50% - 346px));min-width:190px;padding:8px 0;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.16);display:none}
#pmenu.on{display:block}
#pmenu button{display:block;width:100%;padding:14px 22px;border:0;background:none;text-align:left;color:#171717;font:400 16px/22px var(--sf);cursor:pointer}
#pmenu button:active{background:#f1f1f1}
#pundo{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:18px;padding:6px 6px 6px 18px;border-radius:16px;background:#2b2b2b;color:#fff;font:400 15px/20px var(--sf);box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
#pundo.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pundo button{border:0;background:none;color:#9ec5ff;font:600 15px/20px var(--sf);padding:8px 12px;cursor:pointer}
/* docked bottom toolbar */
body #v2tb,body #v2tbPal,body #v2tbFont{--fg:#3b3f66;--ac:#4f46e5;--tb-hov:#eef0ff;--gl-bd:rgba(20,22,43,.1);--gl-in:transparent;--gl-sh:rgba(20,22,43,.14);background:rgba(255,255,255,.94);color:#3b3f66}
body #v2tb{left:0;right:0;transform:none;width:100%;max-width:100vw;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid rgba(20,22,43,.07);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(20,22,43,.08)}
body #v2tb button{border-radius:12px;height:40px;min-width:40px}
body #v2tb [data-c=render]{background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;padding:0 14px;font-weight:700;font-size:13px;margin-right:2px}
body #v2tb i.sp{background:rgba(20,22,43,.1)}
body #v2tbPal,body #v2tbFont{border:1px solid rgba(20,22,43,.08);box-shadow:0 12px 32px rgba(20,22,43,.18)}
/* v18: hide editor toolbar while the landing page is open */
body:has(#panel.on) #v2tb,body:has(#panel.on) #v2tbPal,body:has(#panel.on) #v2tbFont{display:none!important}

/* v30 landing: HyperOS-style notes (drawer, header, bottom bar) */
#panel{background:#f2f2f4}
#pmain{position:absolute;inset:0;display:flex;flex-direction:column;background:#fafafa;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform;overflow:hidden}
#panel.dr #pmain{transform:translateX(min(77%,360px));box-shadow:-6px 0 24px rgba(0,0,0,.08)}
#pscrim{position:absolute;inset:0;z-index:40;display:none}
#panel.dr #pscrim{display:block}
#pdrawer{position:absolute;top:0;bottom:0;left:0;width:min(77%,360px);overflow-y:auto;padding:env(safe-area-inset-top,0) 0 40px;color:#171717}
#dhead{display:flex;align-items:center;height:76px;padding:0 20px 0 22px}
#dhead h2{flex:1;margin:0;font:500 28px/34px var(--sf)}
#dhead button,#dfadd{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:#171717;display:grid;place-items:center;cursor:pointer}
.dcard{margin:8px 14px 0;background:#fff;border-radius:22px;padding:0;overflow:hidden}
.drow{position:relative;display:flex;align-items:center;gap:14px;height:56px;padding:0 16px 0 18px;cursor:pointer}
.drow:active{background:#f4f4f4}
.drow.on{background:#fcf8ea}
.drow:not(:last-child)::after{content:'';position:absolute;left:58px;right:0;bottom:0;height:1px;background:#ececec}
.drow .di{flex:none;width:24px;height:24px;display:grid;place-items:center}
.drow .dn{flex:1;min-width:0;font:400 17px/22px var(--sf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dc{flex:none;font:400 15px/20px var(--sf);color:#9a9a9a}
.drow .dg{flex:none;color:#b0b0b0;display:grid}
#dfh{display:flex;align-items:center;margin:26px 14px 0 22px;height:40px;color:#8c8c8c;font:400 16px/20px var(--sf)}
#dfh span{flex:1}
#dfadd{color:#444}
#dfl:empty{display:none}
#pnav .hg.h-main{gap:4px}
#pttl{width:auto;border-radius:0;flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:#171717;height:56px}
#pttl:active{background:none!important}
#pttl #plt{flex:0 1 auto;font:400 22px/26px var(--sf);letter-spacing:0}
#pttl .ic{flex:none;width:38px;height:38px;border-radius:11px;background:#2b2b2b;display:grid;place-items:center}
#pttl .tx{min-width:0}
#pttl .t1{display:flex;align-items:center;gap:6px;font:400 22px/26px var(--sf)}
#pttl .t1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pttl .t1 i{flex:none;width:0;height:0;border-left:7px solid #171717;border-top:5px solid transparent;border-bottom:5px solid transparent}
#pttl .t2{font:400 14px/18px var(--sf);color:#8c8c8c}
.row{display:flex;align-items:center;gap:12px;min-height:0;padding:16px 24px 16px 24px}
.row:not(:last-child)::after{left:24px;right:24px}
.rt b{font:400 17px/22px var(--sf)}
.rt span{margin-top:4px}
.rt time{display:inline-block;margin-top:8px;padding:2px 7px;border-radius:5px;background:#efefef;font:400 12px/16px var(--sf);color:#8c8c8c}
.row.nopv .rt time{margin-top:6px}
#pNew{left:auto;right:max(20px,calc(50% - 340px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#4a4a4a;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#pbn{flex:none;display:flex;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fafafa;border-top:1px solid #ececec}
#pbn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9a9a9a;font:400 14px/16px var(--sf);cursor:pointer}
#pbn button.on{color:#171717}
#pbn button svg{display:block}
#panel.sel #pbn,#panel.srch #pbn{display:none}
#panel.sel #pundo,#panel.srch #pundo{bottom:30px}
#pundo{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#pph{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9a9a9a;font:400 17px/22px var(--sf)}
#pph b{font:400 28px/34px var(--sf);color:#171717}
#panel.ph #pph{display:flex}
#panel.ph #pnav,#panel.ph #pscroll,#panel.ph #pNew{display:none}
#pdlg{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#pdlg.on{display:flex}
#pdlg .bx{width:min(320px,86vw);max-height:80vh;overflow-y:auto;background:#fff;border-radius:26px;padding:22px 20px 12px;color:#171717}
#pdlg h3{margin:0 0 14px;font:500 20px/26px var(--sf)}
#pdlg input{width:100%;height:46px;border:0;border-radius:14px;background:#f1f1f1;padding:0 16px;font:400 17px var(--sf);color:#171717;outline:0;-webkit-user-select:text;user-select:text}
#pdlg .ac{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
#pdlg .ac button{border:0;background:none;padding:10px 14px;border-radius:12px;font:500 16px var(--sf);color:#2b6de0;cursor:pointer}
#pdlg .ac button:active{background:#eef3ff}
#pdlg .drow{margin:0 -20px;padding:0 20px;height:52px}
#pdlg .drow:not(:last-child)::after{left:60px}
/* v31 editor page: same flat style as landing */
html,body{background:#fafafa}
#top{height:60px;gap:4px;padding:0 8px 0 6px;padding-top:env(safe-area-inset-top,0);background:#fafafa;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid #ececec}
#top input{font:400 22px/26px system-ui,-apple-system,"Roboto","Segoe UI",Arial,sans-serif;letter-spacing:0;color:#171717;padding:0 4px}
#top input::placeholder{color:#9a9a9a;font-weight:400}
#top button{width:44px;height:44px;min-width:44px;padding:0;border-radius:50%;background:none;box-shadow:none;color:#171717}
#top button:active{background:rgba(0,0,0,.07);transform:none}
#emenu{position:fixed;z-index:60;top:calc(56px + env(safe-area-inset-top,0px));right:12px;min-width:210px;padding:8px 0;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.16);display:none}
#emenu.on{display:block}
#emenu button{display:flex;align-items:center;gap:14px;width:100%;height:50px;padding:0 20px;border:0;background:none;text-align:left;color:#171717;font:400 16px/22px system-ui,-apple-system,"Roboto","Segoe UI",Arial,sans-serif;cursor:pointer}
#emenu button:active{background:#f1f1f1}
#emenu button svg{flex:none}
#emenu button.on{background:#fcf8ea}#emenu button.off{color:#8c8c8c}#emenu button.dis{opacity:.4}
body:has(#panel.on) #emenu{display:none!important}
#pbar{top:60px;background:#fafafa;border-bottom:1px solid #ececec}
#pbar select,#pbar button{border:0;background:#efefef;color:#171717;font:400 14px system-ui,sans-serif}
#pbar button.pri{background:#4a4a4a;color:#fff}
#tune{top:calc(64px + env(safe-area-inset-top,0px));border-radius:22px;background:#fff;color:#171717}
#tune label b{color:#171717}#tune input[type=range]{accent-color:#171717}#tune .tf button{background:#efefef;color:#171717}

/* v33: RGB animated render icon, no background */

#rpop{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top,0px));z-index:130;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:18px;background:rgba(24,24,27,.95);color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.3);opacity:0;pointer-events:none;transform:translate(-50%,-20px) scale(.8);max-width:92vw}

#rpop.hide{animation:rpOut .28s ease-in forwards}
@keyframes rpIn{to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes rpOut{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-14px) scale(.9)}}
#rpop .ri{width:30px;height:30px;flex:none}
#rpop .rc{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}
#rpop.show .rc{animation:rpDraw .55s ease-out .12s forwards}
#rpop.show .rm{animation:rpDraw .4s ease-out .5s forwards}
#rpop .rm{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
@keyframes rpDraw{to{stroke-dashoffset:0}}
#rpop.ok .rc,#rpop.ok .rm{stroke:#30d158}

#rpop .rs{display:block;font-weight:500;font-size:12px;opacity:.7;margin-top:1px}
@keyframes rgbcol{0%{color:#ff2d55}17%{color:#ff9f0a}33%{color:#30d158}50%{color:#00d4ff}67%{color:#2d7bff}83%{color:#bf5af2}100%{color:#ff2d55}}

const PDFX_LIBS=[
  ['jspdf',      ()=>window.jspdf,    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'],
  ['svg2pdf',    ()=>window.svg2pdf,  'https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js'],
  ['opentype',   ()=>window.opentype, 'https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js'],
  ['harfbuzz',   ()=>window.hbjs,     'https://cdn.jsdelivr.net/npm/harfbuzzjs@0.3.6/hbjs.js'],
  ['pako',       ()=>window.pako,     'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'],
  ['pdf-lib',    ()=>window.PDFLib,   'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js']
];
function pdfxLoadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res;
    s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s);
  });
}
let _pdfxLibsP=null;
function pdfxEnsureLibs(onProgress){
  if(_pdfxLibsP) return _pdfxLibsP;
  _pdfxLibsP=(async()=>{
    let i=0;
    for(const [name,has,src] of PDFX_LIBS){
      if(!has()) await pdfxLoadScript(src);
      i++; if(onProgress) onProgress(name,i,PDFX_LIBS.length);
    }
  })().catch(e=>{ _pdfxLibsP=null; throw e; });
  return _pdfxLibsP;
}

    store['notes-pins']=JSON.stringify(J('notes-pins',[]).filter(function(p){ return ids.indexOf(p)>-1; }));
    Object.keys(store).forEach(function(key){ (store[key].match(/img:[A-Za-z0-9]+/g)||[]).forEach(function(m){ used[m]=1; }); });
    if(!Object.keys(store).some(function(x){ return /^note:/.test(x); })) return say('err','Note not found','Open the note once and try again');
  }
  for(i=0;i<ls.length;i++){ k=ls.key(i); if(!/^img:/.test(k)||(ids&&!used[k])) continue;
    var d=ls.getItem(k)||'', c=d.indexOf(','); if(d.indexOf('data:')!==0||c<0) continue;
    var mime=d.slice(5,d.indexOf(';'));
    z.file('images/'+k.slice(4)+'.'+(EXT[mime]||'png'),d.slice(c+1),{base64:true,compression:'STORE'}); nImg++; }
  /* human-readable copies (the app only needs store.json) */
  Object.keys(store).forEach(function(key){
    var m=/^note:(.+):md$/.exec(key); if(m) z.file('notes/'+m[1]+'.md',store[key]);
    m=/^note:(.+):json$/.exec(key);
    if(m){ var id=m[1]; try{ (function walk(n){ if(!n||typeof n!=='object') return;
      if(n.type==='widget'&&n.attrs&&n.attrs.code){ nW++; z.file('widgets/'+id+'-'+nW+'.html',n.attrs.code); }
      (n.content||[]).forEach(walk); })(JSON.parse(store[key]).fmt); }catch(_){} }
  });
  z.file('manifest.json',JSON.stringify({format:'notedown',kind:(ids&&ids.length===1&&!opt.bundle)?'note':'bundle',version:1,exported:new Date().toISOString(),images:nImg,widgets:nW}));
  z.file('store.json',JSON.stringify(store));
  var blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},null);
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  var nm='notes-'+new Date().toISOString().slice(0,10);
  if(ids&&ids.length===1){ var ix=J('notes-index',[]).filter(function(x){ return x.id===ids[0]; })[0]; nm=((ix&&ix.title)||'note').replace(/[^\w\- ]+/g,'').trim().slice(0,40)||'note'; }
  if(opt.name) nm=String(opt.name).replace(/[^\w\- ]+/g,'').trim().slice(0,40)||nm;
  var one=!!(ids&&ids.length===1&&!opt.bundle);
  a.download=nm+(one?'.notedown':'.notes');
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  say('ok','Exported',(ids?ids.length+' note(s), ':'Notes, ')+nImg+' image(s), '+nW+' widget(s)');
}

/* ---------- IMPORT (merge, never deletes existing notes) ---------- */
async function importZip(file,want){
  if(!window.JSZip) throw new Error('Zip library not loaded');
  var z=await JSZip.loadAsync(file), mf=z.file('manifest.json'), st=z.file('store.json');
  var info=mf&&st?JSON.parse(await mf.async('string')):null;
  if(!info||info.format!=='notedown') throw new Error('Not a .notes or .notedown file');
  if(want&&info.kind&&info.kind!==want) throw new Error(want==='note'?'This is a .notes bundle. Use "Import .notes file".':'This is a single note. Use "Import individual notes".');
  var store=JSON.parse(await st.async('string')), names=Object.keys(z.files), i;
  for(i=0;i<names.length;i++){ var m=/^images\/(.+)\.(\w+)$/.exec(names[i]); if(!m||z.files[names[i]].dir) continue;
    localStorage.setItem('img:'+m[1],'data:'+(MIME[m[2].toLowerCase()]||'image/png')+';base64,'+await z.files[names[i]].async('base64')); }
  var byId=function(k){ var o={}; J(k,[]).concat(JSON.parse(store[k])).forEach(function(x){ o[x.id]=x; }); return Object.keys(o).map(function(q){ return o[q]; }); };
  for(var key in store){
    if(key==='notes-index') localStorage.setItem(key,JSON.stringify(byId(key).sort(function(a,b){ return (b.updated||0)-(a.updated||0); })));
    else if(key==='notes-folders') localStorage.setItem(key,JSON.stringify(byId(key)));
    else if(key==='notes-fmap') localStorage.setItem(key,JSON.stringify(Object.assign(J(key,{}),JSON.parse(store[key]))));
    else if(key==='notes-pins') localStorage.setItem(key,JSON.stringify(Array.from(new Set(J(key,[]).concat(JSON.parse(store[key]))))));
    else if(/^note:/.test(key)||localStorage.getItem(key)===null) localStorage.setItem(key,store[key]);
  }
  say('ok','Imported','Reloading your notes…'); setTimeout(function(){ location.reload(); },900);
}

    if(/\.(notedown|notes)$/i.test(f.name)) await importZip(f); else say('warn','Unsupported file','Open a .notedown or .notes file'); }
  catch(e){ say('err','Import failed',e.message||'Could not read file'); } } }); }
